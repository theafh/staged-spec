# deployment.conf — per-tool deployment configuration
#
#   #tool                  Section heading — tool identifier (vscode, cursor, claude, codex, gemini, antigravity)
#   disallow:path          Local repo path relative to repo root (e.g. agents/check_spec_codex.md)
#                         Glob patterns supported (* matches within a segment, ** matches across segments)
#   replace:path VAR=value Force copied deployment for matching assets and replace $VAR$
#                         inside the deployed copy only. A trailing slash applies to a whole subtree.
#
# Assets not listed under a tool section are deployed to that tool.
# Assets listed under disallow: are skipped for that tool.
# Multiple replace: lines can apply to the same path.

#cursor
disallow:*legacy*
replace:agents/auto_spec_check.md AUTO_SPEC_CHECK_A=check_spec_composer
replace:agents/auto_spec_check.md AUTO_SPEC_CHECK_B=check_spec_codex
##replace:agents/auto_spec_check.md AUTO_SPEC_CHECK_C=check_spec_opus ## Opus is very expensive to run, so we won't deploy it for cursor. We can enable it later if needed.
replace:agents/auto_spec_check.md AUTO_SPEC_CHECK_C=check_spec_gemini

#vscode
disallow:*legacy*
disallow:hooks/*
disallow:agents/check_spec_composer.md
replace:agents/auto_spec_check.md AUTO_SPEC_CHECK_A=check_spec_codex
replace:agents/auto_spec_check.md AUTO_SPEC_CHECK_B=check_spec_opus
replace:agents/auto_spec_check.md AUTO_SPEC_CHECK_C=check_spec_gemini

#claude
disallow:*legacy*
disallow:agents/auto_spec_check.md
disallow:agents/check_spec_codex.md
disallow:agents/check_spec_composer.md
disallow:agents/check_spec_opus.md

#codex
disallow:*legacy*
disallow:agents/auto_spec_check.md
disallow:agents/check_spec_codex.md
disallow:agents/check_spec_composer.md
disallow:agents/check_spec_opus.md
disallow:hooks/*

#gemini
disallow:*legacy*
disallow:agents/auto_spec_check.md
disallow:agents/check_spec_codex.md
disallow:agents/check_spec_composer.md
disallow:agents/check_spec_opus.md
disallow:hooks/*

#antigravity
disallow:*legacy*
disallow:agents/auto_spec_check.md
disallow:agents/check_spec_codex.md
disallow:agents/check_spec_composer.md
disallow:agents/check_spec_opus.md
disallow:hooks/*
